
{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<h1>Add New Student</h1>

<form action="{{ url_for('add_student_page') }}" method="POST">

    <label for="id">Student ID:</label>
    <input type="number"
           id="id"
           name="id"
           required>

    <label for="name">Student Name:</label>
    <input type="text"
           id="name"
           name="name"
           required>

    <label for="gpa">GPA:</label>
    <input type="number"
           id="gpa"
           name="gpa"
           min="0"
           max="4"
           step="0.01"
           required>

    <button type="submit">Add Student</button>

</form>

{% endblock %}
