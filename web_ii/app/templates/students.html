
{% extends "base.html" %}

{% block title %}All Students{% endblock %}

{% block content %}

<h1>Student List</h1>

<a class="button" href="{{ url_for('add_student_page') }}">
    + Add New Student
</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>GPA</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.gpa }}</td>
            <td>
                <a class="button"
                   href="{{ url_for('edit_student_page', id=student.id) }}">
                    Edit
                </a>

                <button class="danger"
                        onclick="deleteStudent({{ student.id }})">
                    Delete
                </button>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No students found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
async function deleteStudent(id) {

    if (!confirm("Are you sure you want to delete this student?")) {
        return;
    }

    const response = await fetch(`/students/${id}`, {
        method: "DELETE"
    });

    if (response.ok) {
        window.location.reload();
    } else {
        alert("Error deleting student.");
    }
}
</script>

{% endblock %}
