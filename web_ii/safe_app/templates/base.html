
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Management{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
    {% if session.get("faculty") %}

        <a href="{{ url_for('students_page') }}">
            All Students
        </a>

        <a href="{{ url_for('add_student_page') }}">
            Add Student
        </a>

        <span class="faculty-name">
            Logged in as: {{ session["faculty"] }}
        </span>

        <form action="{{ url_for('logout') }}"
              method="POST"
              class="logout-form">
            <button type="submit">Logout</button>
        </form>

    {% else %}

        <a href="{{ url_for('login') }}">Login</a>

    {% endif %}
</nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
