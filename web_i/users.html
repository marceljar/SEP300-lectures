<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>All Users</title>
  <style>
    table { border-collapse: collapse; 
            width: 60%; margin: 20px auto; }
    th, td { border: 1px solid #ccc; 
             padding: 8px; text-align: left; }
    th { background: #eee; }
    a { text-decoration: none; color: #0077cc; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">All Users</h2>

  <table>
    <tr>
      <th>ID</th><th>First Name</th>
      <th>Last Name</th><th>Balance</th>
    </tr>
    {% for u in users %}
    <tr>
      <td>{{ u.user_id }}</td>
      <td>{{ u.first_name }}</td>
      <td>{{ u.last_name }}</td>
      <td>{{ "%.2f"|format(u.balance) }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
